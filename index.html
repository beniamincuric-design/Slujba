<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">

<title>Implică-te în slujire · Biserica Philadelphia Mansuè</title>

<style>
  :root{
    --bg:#2b1e16; --card:#3a2a1f; --line:#5a4433; --ink:#f3ebdf; --muted:#cdbfa9;
    --gold:#dcc8a5; --gold2:#efe1c6; --ok:#cfe0b0; --err:#ffb7a3;
    --field:#20160f; --sel:#4b3727; --btnink:#2b1e16;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.5}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:560px;margin:0 auto;padding:18px 20px 60px}
  .lang{display:flex;justify-content:flex-end;gap:0;margin-bottom:6px}
  .lang button{background:transparent;color:var(--muted);border:1px solid var(--line);padding:6px 14px;font:600 13px Inter,sans-serif;cursor:pointer}
  .lang button:first-child{border-radius:999px 0 0 999px}
  .lang button:last-child{border-radius:0 999px 999px 0;border-left:0}
  .lang button[aria-pressed=true]{background:var(--gold);color:var(--btnink);border-color:var(--gold)}
  header{text-align:center;padding:4px 0 8px}
  .logo{display:block;margin:0 auto 14px;width:78%;max-width:340px;height:auto}
  h1{font-family:Fraunces,serif;font-weight:700;font-size:34px;line-height:1.1;margin:14px 0 10px}
  .lead{color:var(--muted);margin:0 auto;max-width:440px}
  .verse{margin:26px 0;padding:18px 20px;border-left:3px solid var(--gold);background:var(--card);border-radius:0 14px 14px 0;font-family:Fraunces,serif;font-size:17px}
  .verse small{display:block;margin-top:8px;font-family:Inter,sans-serif;font-size:13px;color:var(--gold)}
  h2{font-family:Fraunces,serif;font-size:22px;margin:34px 0 12px}
  .info{display:grid;gap:10px}
  .info div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .info b{color:var(--gold2)}
  label.f{display:block;font-weight:600;margin:18px 0 6px}
  .hint{font-weight:400;color:var(--muted);font-size:14px}
  input[type=text],input[type=tel],input[type=email],input[type=password],input[type=number],textarea{
    width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:inherit}
  input:focus,textarea:focus{outline:2px solid var(--gold);border-color:transparent}
  textarea{min-height:90px;resize:vertical}
  .deps{display:grid;gap:10px}
  .dep{position:relative;display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;transition:border-color .15s,background .15s}
  .dep input{position:absolute;opacity:0;pointer-events:none}
  .ic{width:26px;height:26px;flex:none;fill:var(--gold);margin-top:2px}
  .dep .t{font-weight:600}
  .dep .d{color:var(--muted);font-size:14px}
  .dep:has(input:checked){border-color:var(--gold);background:var(--sel)}
  .dep:has(input:checked)::after{content:"✓";position:absolute;right:14px;top:12px;color:var(--gold);font-weight:700}
  .dep.closed{cursor:default;opacity:.55;border-style:dashed}
  .pill{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:500;border:1px solid var(--gold);color:var(--gold)}
  .pill.off{border-color:var(--line);color:var(--muted)}
  .consent{display:flex;gap:10px;align-items:flex-start;margin-top:22px;font-size:14px;color:var(--muted)}
  .consent input{width:20px;height:20px;margin-top:2px;accent-color:var(--gold)}
  button{font:600 15px Inter,sans-serif;cursor:pointer;border-radius:12px}
  .btn{width:100%;margin-top:24px;padding:16px;border:0;border-radius:14px;background:var(--gold);color:var(--btnink);font-size:17px}
  .btn:disabled{opacity:.6}
  .gh{background:transparent;color:var(--gold);border:1px solid var(--gold);padding:9px 14px}
  .gh.sm{padding:6px 11px;font-size:13px;border-radius:10px}
  .gh.red{color:var(--err);border-color:#7a4a3c}
  .gh.solid{background:var(--gold);color:var(--btnink)}
  .msg{margin-top:14px;font-size:15px}
  .msg.err{color:var(--err)}
  .center{text-align:center;padding:40px 10px}
  .center .ic{width:52px;height:52px;margin:0 auto}
  footer{margin-top:44px;text-align:center;color:var(--muted);font-size:13px}
  [hidden]{display:none!important}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:10px}
  .card h3{margin:0;font-size:17px}
  .meta{color:var(--muted);font-size:14px}
  .meta a,.card a{color:var(--gold)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;color:var(--ink);font-weight:500}
  .chip.on{border-color:var(--gold);color:var(--gold)}
  .st{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
  .st.nou{border-color:var(--gold);color:var(--gold)} .st.acceptat{border-color:#8fae6e;color:var(--ok)} .st.respins{color:var(--err);border-color:#7a4a3c}
  .depadm{display:grid;gap:8px}
  .depadm .num{width:64px;padding:7px 9px;border-radius:10px}
  #qrbox{background:#fff;padding:16px;border-radius:14px;display:inline-block;margin-top:12px}
  #qrbox svg{display:block;width:240px;height:240px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
  .overlay>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:340px}
</style>
</head>

function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el => el.innerHTML = t(el.dataset.t));
  document.querySelectorAll("[data-tp]").forEach(el => el.placeholder = t(el.dataset.tp));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANG));
  document.title = t("docTitle");
  if(ADMIN){ $("ttl").textContent = t("adminTitle"); }
  ["msg","lerr","perr"].forEach(id => { $(id).textContent = ""; });

  if(!$("setpw").hidden) $("setpwT").textContent = t(setpwMode);
}

async function rpc(fn, body){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {method:"POST",
    headers:{apikey:SB_KEY, "Content-Type":"application/json"}, body:JSON.stringify(body||{})});
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).message || r.status);
  return r.status === 204 ? null : r.json();
}
function ask(text){
  return new Promise(res => { $("cfText").textContent = text; $("confirm").hidden = false;
    $("cfYes").onclick = () => { $("confirm").hidden = true; res(true); };
    $("cfNo").onclick = () => { $("confirm").hidden = true; res(false); }; });
}

function renderDeps(){
  const sel = new Set([...document.querySelectorAll("input[name=dep]:checked")].map(i => i.value));
  $("deps").innerHTML = DEPS.map(d => d.deschis
    ? `<label class="dep"><input type="checkbox" name="dep" value="${esc(d.id)}" ${sel.has(d.id) ? "checked" : ""}>${icon(d.icon)}<span><div class="t">${esc(depN(d))}</div><div class="d">${esc(depD(d))}</div>${d.cautam ? `<span class="pill">${t("seeking", d.cautam)}</span>` : ""}</span></label>`
    : `<div class="dep closed">${icon(d.icon)}<span><div class="t">${esc(depN(d))}</div><div class="d">${esc(depD(d))}</div><span class="pill off">${t("closed")}</span></span></div>`
  ).join("");
}

  try{
    const r = await fetch(SB_URL + "/rest/v1/slujire_inscrieri", {method:"POST",
      headers:{apikey:SB_KEY, "Content-Type":"application/json", Prefer:"return=minimal"}, body:JSON.stringify(rows)});
    if(!r.ok) throw new Error(r.status);
    $("main").hidden = true; $("done").hidden = false; scrollTo(0, 0);
  }catch(x){
    const closedNow = x.message === "401" || x.message === "403";
    msg.className = "msg err"; msg.textContent = closedNow ? t("eClosedNow") : t("eNet");
    if(closedNow) loadDeps();
    btn.disabled = false; btn.textContent = t("send");
  }
});

// ---------- admin (login cu email) ----------
let fSt = "nou", fDep = null, sess = null;
const AUTH = SB_URL + "/auth/v1";
function saveSess(j){ sess = {access_token:j.access_token, refresh_token:j.refresh_token, expires_at: Date.now() + (j.expires_in||3600)*1000};
  try{ localStorage.setItem("slujire_sess", JSON.stringify(sess)); }catch(e){} }
function clearSess(){ sess = null; try{ localStorage.removeItem("slujire_sess"); }catch(e){} }
async function authFetch(path, opts){
  const r = await fetch(AUTH + path, {...opts, headers:{apikey:SB_KEY, "Content-Type":"application/json", ...(opts.headers||{})}});
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || j.message || r.status);
  return j;
}
async function token(){
  if(!sess) throw new Error("login");
  if(Date.now() > sess.expires_at - 60000){
    try{ saveSess(await authFetch("/token?grant_type=refresh_token", {method:"POST", body:JSON.stringify({refresh_token:sess.refresh_token})})); }
    catch(e){ clearSess(); throw new Error("login"); }
  }
  return sess.access_token;
}
async function arpc(fn, body){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {method:"POST",
    headers:{apikey:SB_KEY, Authorization:"Bearer " + await token(), "Content-Type":"application/json"}, body:JSON.stringify(body||{})});
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).message || r.status);
  return r.status === 204 ? null : r.json();
}
function show(which){ ["login","setpw","app"].forEach(id => $(id).hidden = id !== which); }
async function load(){ data = await arpc("slujire_admin_date"); render(); }
async function act(fn, body){ try{ await arpc(fn, body); await load(); }catch(e){ if(e.message === "login") show("login"); else alert(e.message); } }
async function enter(){
  try{ await load(); show("app"); }
  catch(e){ show("login"); if(e.message !== "login"){ $("lerr").className = "msg err"; $("lerr").textContent = e.message; } }
}
$("login").addEventListener("submit", async e => {
  e.preventDefault(); const L = $("lerr"); L.className = "msg err";
  const em = $("em").value.trim(), pw = $("pw").value;
  if(!/^\S+@\S+\.\S+$/.test(em)){ L.textContent = t("leEmail"); return; }
  if(!pw){ L.textContent = t("lePw"); return; }
  $("go").disabled = true; L.textContent = "";
  try{ saveSess(await authFetch("/token?grant_type=password", {method:"POST", body:JSON.stringify({email:em, password:pw})})); await enter(); }
  catch(x){ L.textContent = /invalid/i.test(x.message) ? t("leWrong") : t("leFail") + x.message; }
  $("go").disabled = false;
});
["em","pw"].forEach(id => $(id).addEventListener("input", () => $("lerr").textContent = ""));
$("forgot").onclick = async () => {
  const L = $("lerr"), em = $("em").value.trim();
  if(!/^\S+@\S+\.\S+$/.test(em)){ L.className = "msg err"; L.textContent = t("leForgotFirst"); return; }
  try{ await authFetch("/recover", {method:"POST", body:JSON.stringify({email:em, redirect_to: location.origin + location.pathname + "?admin=1"})});
    L.className = "msg"; L.textContent = t("leSent"); }
  catch(x){ L.className = "msg err"; L.textContent = t("leSendFail") + x.message; }
};
function openSetpw(mode, canCancel){ setpwMode = mode; $("setpwT").textContent = t(mode); $("np1").value = $("np2").value = ""; $("perr").textContent = ""; $("pwCancel").hidden = !canCancel; show("setpw"); }
$("chpw").onclick = () => openSetpw("aChPw", true);
$("pwCancel").onclick = () => show(sess ? "app" : "login");
$("setpw").addEventListener("submit", async e => {
  e.preventDefault(); const P = $("perr"); P.className = "msg err";
  const a = $("np1").value, b = $("np2").value;
  if(a.length < 8){ P.textContent = t("peShort"); return; }
  if(a !== b){ P.textContent = t("peMismatch"); return; }
  try{ await authFetch("/user", {method:"PUT", headers:{Authorization:"Bearer " + await token()}, body:JSON.stringify({password:a})});
    P.className = "msg"; P.textContent = t("peOk"); setTimeout(enter, 900); }
  catch(x){ P.textContent = x.message === "login" ? t("peExpired") : t("peFail") + x.message; }
});
["np1","np2"].forEach(id => $(id).addEventListener("input", () => $("perr").textContent = ""));
$("logout").onclick = async () => { try{ await authFetch("/logout", {method:"POST", headers:{Authorization:"Bearer " + sess.access_token}}); }catch(e){} clearSess(); location.hash = "#admin"; location.reload(); };
if(ADMIN){
  if(RECOVERY){
    const h = new URLSearchParams(location.hash.slice(1));
    saveSess({access_token:h.get("access_token"), refresh_token:h.get("refresh_token"), expires_in:+h.get("expires_in")||3600});
    history.replaceState(null, "", location.pathname + "#admin");
    openSetpw("aSetNew", false);
  } else {
    try{ sess = JSON.parse(localStorage.getItem("slujire_sess")); }catch(e){}
    if(sess) enter(); else show("login");
  }
}

const depById = id => data.departamente.find(d => d.id === id) || {id, nume:id};
function render(){
  const vis_d = data.departamente.filter(d => !d.ascuns);
  $("cine").innerHTML = `${t("aWho")} <b style="color:var(--gold2);font-weight:600">${esc(LANG === "it" && DEP_IT[vis_d[0]?.id] && vis_d.length === 1 ? DEP_IT[vis_d[0].id][0] : data.nume)}</b><br><span style="font-size:13px">${esc(data.email || "")}</span>`;
  $("hdep").textContent = data.rol === "admin" ? t("aAll") : (vis_d.length === 1 ? t("aMine1") : t("aMineN"));
  $("depadm").innerHTML = vis_d.map(d => `
    <div class="card" style="margin:0">
      <div class="row" style="justify-content:space-between;flex-wrap:nowrap">
        <div class="row" style="flex-wrap:nowrap">${icon(d.icon)}<div><h3>${esc(depN(d))}</h3>
          <div class="meta">${t("aCounts", d.noi, d.acceptati)}</div></div></div>
        <span class="st ${d.deschis ? "acceptat" : "respins"}">${d.deschis ? t("aOpen") : t("aClosed")}</span>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="gh sm ${d.deschis ? "red" : "solid"}" data-tog="${d.id}">${d.deschis ? t("aDoClose") : t("aDoOpen")}</button>
        <span class="row" style="flex-wrap:nowrap;gap:6px"><span class="meta">${t("aStill")}</span>
        <input class="num" type="number" min="0" inputmode="numeric" placeholder="—" value="${d.cautam ?? ""}" data-num="${d.id}">
        <button class="gh sm" data-save="${d.id}">${t("aSave")}</button></span>
      </div>
    </div>`).join("");
  document.querySelectorAll("[data-tog]").forEach(b => b.onclick = () => {
    const d = depById(b.dataset.tog); act("slujire_set_dep", {dep:d.id, des:!d.deschis, nr:d.cautam});
  });
  document.querySelectorAll("[data-save]").forEach(b => b.onclick = () => {
    const d = depById(b.dataset.save);
    const v = document.querySelector(`[data-num="${d.id}"]`).value;
    const nr = v === "" ? null : Math.max(0, parseInt(v, 10) || 0);
    act("slujire_set_dep", {dep:d.id, des: nr ? true : d.deschis, nr});
  });
  const all = data.inscrieri;
  const STK = {nou:"fNou", acceptat:"fAcceptat", respins:"fRespins", toti:"fToti"};
  const cnt = s => all.filter(r => (s === "toti" || r.status === s) && (!fDep || r.departament === fDep)).length;
  $("fst").innerHTML = Object.keys(STK).map(s => `<button class="chip ${fSt === s ? "on" : ""}" data-st="${s}">${t(STK[s])} (${cnt(s)})</button>`).join("");
  const depsCu = [...new Set(all.map(r => r.departament))];
  $("fdep").innerHTML = depsCu.length > 1 ? [`<button class="chip ${!fDep ? "on" : ""}" data-dep="">${t("fAllDeps")}</button>`]
    .concat(depsCu.map(id => `<button class="chip ${fDep === id ? "on" : ""}" data-dep="${esc(id)}">${esc(depN(depById(id)))}</button>`)).join("") : "";
  document.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { fSt = b.dataset.st; render(); });
  document.querySelectorAll("[data-dep]").forEach(b => b.onclick = () => { fDep = b.dataset.dep || null; render(); });
  const SL = {nou:"sNou", acceptat:"sAcceptat", respins:"sRespins"};
  const vis = all.filter(r => (fSt === "toti" || r.status === fSt) && (!fDep || r.departament === fDep));
  $("list").innerHTML = vis.map(r => {
    const tel = r.telefon.replace(/[^\d+]/g, ""); let wa = tel.replace(/^\+/, "").replace(/^00/, "");
    if(wa.length === 10 && wa[0] === "3") wa = "39" + wa;
    return `<div class="card">
      <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h3>${esc(r.nume)}</h3><span class="st ${r.status}">${t(SL[r.status])}</span></div>
      <div class="meta"><b style="color:var(--gold2);font-weight:500">${esc(depN(depById(r.departament)))}</b>${r.detalii ? `: ${esc(r.detalii)}` : ""} · ${new Date(r.created_at).toLocaleDateString(t("locale"))}</div>
      <div class="meta"><a href="tel:${esc(tel)}">${esc(r.telefon)}</a> · <a target="_blank" href="https://wa.me/${esc(wa)}">WhatsApp</a>${r.email ? ` · <a href="mailto:${esc(r.email)}">${esc(r.email)}</a>` : ""}</div>
      ${r.experienta ? `<div style="margin-top:6px;font-size:15px">${esc(r.experienta)}</div>` : ""}
      <div class="row" style="margin-top:10px">
        ${r.status !== "acceptat" ? `<button class="gh sm solid" data-s="acceptat" data-id="${r.id}">${t("bAccept")}</button>` : ""}
        ${r.status !== "respins" ? `<button class="gh sm" data-s="respins" data-id="${r.id}">${t("bReject")}</button>` : ""}
        ${r.status !== "nou" ? `<button class="gh sm" data-s="nou" data-id="${r.id}">${t("bBack")}</button>` : ""}
        <button class="gh sm red" data-del="${r.id}" style="margin-left:auto">${t("bDel")}</button>
      </div></div>`;
  }).join("") || `<p class="meta">${t("aEmpty")}</p>`;
  document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => act("slujire_set_status", {rid:+b.dataset.id, st:b.dataset.s}));
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if(await ask(t("aDelQ"))) act("slujire_sterge", {rid:+b.dataset.del});
  });
}
$("reload").onclick = load;
$("csv").onclick = () => {
  const c = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [t("csv").join(";")].concat(data.inscrieri.map(r => [new Date(r.created_at).toLocaleString(t("locale")), r.nume, r.telefon, r.email,
    depN(depById(r.departament)), r.detalii, r.experienta, t({nou:"sNou", acceptat:"sAcceptat", respins:"sRespins"}[r.status])].map(c).join(";")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], {type:"text/csv"}));
  a.download = "inscrieri-slujire.csv"; a.click();
};
$("qrbtn").onclick = async () => {
  let c; try{ c = await arpc("slujire_cod"); }catch(e){ return alert(e.message); }
  const url = location.origin + location.pathname + "?k=" + c;
  const qr = qrcode(0, "M"); qr.addData(url); qr.make();
  $("qrbox").innerHTML = qr.createSvgTag({cellSize:8, margin:2, scalable:true});
  $("qrlink").href = url; $("qrlink").textContent = url; $("qrwrap").hidden = false;
  $("qrdl").onclick = () => { const a = document.createElement("a"); a.href = qr.createDataURL(16, 4); a.download = "qr-slujire.png"; a.click(); };
};
